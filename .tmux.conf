set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',*256col*:Tc'

# マウス操作を有効化
set -g mouse on

# ウィンドウとペインのインデックスを1から開始（デフォルトは0）
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# ウィンドウを閉じた時に番号を自動で詰める
set -g renumber-windows on

# ステータスバーの更新間隔（秒）と位置
set -g status-interval 3
set -g status-position bottom

set -g set-clipboard on


# プラグイン一覧
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ------------------------------------------------------------------------------
# 2. キーバインド (Key Bindings)
# ------------------------------------------------------------------------------
# プレフィックスキーを Ctrl + a に変更 (デフォルトの Ctrl + b を解除)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefix + r で設定ファイルを再読み込み
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# コピーモードを vi スタイルにする
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Prefix + 矢印キーでペインのサイズを変更
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Ctrl + hjkl でペインを移動 (Vimとの連携 / vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Popup
bind-key t if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -w 80% -h 80% -E "tmux new-session -A -s popup"'

# ------------------------------------------------------------------------------
# 3. 外観・テーマ設定 (Appearance & Theme - Catppuccin)
# ------------------------------------------------------------------------------
# Catppuccin テーマの基本設定
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

set -g @catppuccin_window_text " #I #W"
set -g @catppuccin_window_current_text " #I #W"

# ステータスバーの左右の長さ設定
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""

# ------------------------------------------------------------------------------
# 4. プラグイン管理 (TPM - Tmux Plugin Manager)
# ------------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

run ~/.tmux/plugins/tmux/catppuccin.tmux

run '~/.tmux/plugins/tpm/tpm'
